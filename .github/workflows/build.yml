name: Build APK SMKN 1 Pancur Batu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Terima Lisensi Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Bersihkan Karakter Tersembunyi BOM Windows
        run: |
          find . -type f \( -name "*.xml" -o -name "*.kt" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i '1s/^\xEF\xBB\xBF//' {} +

      - name: Pastikan Folder & File Audio Ada
        run: |
          mkdir -p app/src/main/res/raw
          if [ ! -f "app/src/main/res/raw/indonesia_raya.mp3" ]; then
            echo "ID3" > app/src/main/res/raw/indonesia_raya.mp3
          fi

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compile & Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Siapkan Nama Versi & File APK Dinamis
        id: versioning
        run: |
          # 1. Ekstrak versionName dari app/build.gradle.kts
          RAW_VERSION=$(grep 'versionName' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="1.0.0"
          fi
          
          # 2. Susun Tag Versi & Nama File APK Baru
          TAG="v${RAW_VERSION}-b${{ github.run_number }}"
          APK_FILENAME="SMKN1_Pancur_Batu_Indonesia_Raya_v${RAW_VERSION}_build${{ github.run_number }}.apk"
          
          # 3. Rename File APK
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILENAME"
          
          # 4. Simpan Variabel untuk Langkah Release
          echo "APP_TAG=$TAG" >> $GITHUB_ENV
          echo "APP_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "APK_FILE=$APK_FILENAME" >> $GITHUB_ENV

      - name: Upload File ke Halaman Releases GitHub (Versi Dinamis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_TAG }}
          name: "Rilis ${{ env.APP_TAG }} - Bel Otomatis SMKN 1 Pancur Batu"
          body: |
            ### 📢 Rilis Terbaru Bel Otomatis SMKN 1 Pancur Batu
            - **Versi Aplikasi:** `${{ env.APP_VERSION }}`
            - **Nomor Build:** `#${{ github.run_number }}`
            - **Catatan Update:** ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: ${{ env.APK_FILE }}